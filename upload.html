<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>上传与分享 · 文殊资料</title><style>
*{box-sizing:border-box}body{margin:0;background:#161513;color:#eee8df;font:17px/1.7 system-ui}main{max-width:660px;margin:auto;padding:24px 20px}h1{font-size:27px;margin:10px 0}p{margin:10px 0}label{display:block;margin:14px 0 5px}input,textarea,button{font:inherit;border-radius:9px;padding:11px;width:100%;border:1px solid #64594b;background:#24211d;color:inherit}button{cursor:pointer;background:#d9b879;color:#20190e;font-weight:600;margin:12px 0}button:disabled{opacity:.5;cursor:wait}small,.muted{color:#bcb3a8}progress{width:100%;height:18px;accent-color:#d9b879}a{color:#e9c88b;overflow-wrap:anywhere}#status{white-space:pre-wrap;overflow-wrap:anywhere}#result{border:1px solid #64594b;border-radius:12px;padding:16px;margin-top:20px}details{margin-top:24px}li{margin:12px 0;overflow-wrap:anywhere}[hidden]{display:none!important}</style></head><body><main>
<p class="muted">文殊资料 · 网页上传</p><h1>上传 APK，分享给朋友</h1><p>上传并校验完成后，文件公开显示在公共网盘。朋友打开分享链接即可下载，无需登录。</p>
<form id="login"><label for="email">文殊账号邮箱</label><input id="email" type="email" autocomplete="username" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button id="loginButton">登录</button><small>与 App 使用同一个账号。密码和登录凭证不会保存在本网页的本地存储中。</small></form>
<section id="panel" hidden><p id="account"></p><label for="file">选择 Android APK 安装包</label><input id="file" type="file" accept=".apk,application/vnd.android.package-archive"><label for="description">文件说明（可选）</label><textarea id="description" rows="2" maxlength="1000" placeholder="例如：文殊计数器 Android 正式版"></textarea><button id="upload">上传并生成分享链接</button><progress id="progress" value="0" max="100"></progress><p class="muted">请保持此页面打开。失败后点击重试，不会删除电脑上的原文件。关闭页面后，重新登录并选择同一文件可继续尝试上传。</p><details><summary>我已上传的文件</summary><button id="reload">刷新文件列表</button><ul id="files"></ul></details><button id="logout">退出登录</button></section>
<p id="status" role="status" aria-live="polite">正在检查上传服务…</p><section id="result" hidden><h2>分享链接已生成</h2><p><a id="share" target="_blank" rel="noopener"></a></p><button id="copy">复制链接，发给朋友</button><small>朋友用 Android 浏览器下载 APK，再由系统确认安装。iPhone 无法安装 APK；微信中受限时请选择“在浏览器中打开”。</small></section>
<script type="module" src="/upload.js"></script></main></body></html>
